[workspace]
name = "knowledge-network"
version = "0.1.0"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "13.0"

[dependencies]
python = "3.11.*"
numpy = ">=1.24"
matplotlib = ">=3.7"
gymnasium = ">=1.2.3,<2"
ipython = "*"
jupyter = "*"
pytorch-gpu = "==2.10.0"
torchvision = ">=0.25.0,<0.26"
torchaudio = ">=2.10.0,<3"

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[pypi-dependencies]
torchrl = ">=0.3"
highway-env = ">=1.8"

[environments]
transformer = ["transformer"]

[feature.transformer.dependencies]
pandas = ">=1.5"
spacy = ">=3.2"
jupytext = ">=1.13"
